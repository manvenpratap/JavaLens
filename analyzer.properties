# ===================================================================
# JavaLens Configuration File (analyzer.properties)
# Precision AST Static Analysis, Code Comparator & Merge Telemetry
# ===================================================================

# Execution Mode: analyze, compare, merge, report, server, interactive
mode=analyze

# Default Analysis Source Path (file or directory)
source.folder=samples/v1

# Baseline Existing Java Files Path (used in compare, merge, and report modes)
existing.path=samples/v1
old.path=samples/v1

# Newly Generated Java Files Path (containing extra attributes and functions)
generated.path=samples/v2
new.path=samples/v2

# Base Output Directory for Generated Reports, CSVs, and Telemetry Data
output.dir=java_analysis_output

# Active Run Output Folder Context (generated dynamically for each run)
active.run_folder=

# Parallel Worker Thread Pool Size
threads=12

# Marker-Guided Merge Boundaries
merge.start_marker=// START_MERGE
merge.end_marker=// END_MERGE

# Feature Engine Toggles
enhancement.compare.enabled=true
enhancement.merge.enabled=true

# Web GUI Server Port
server.port=8080
